# กฎของ gitleaks สำหรับ NOSION — ใช้กฎมาตรฐานทั้งหมด แล้วยกเว้นเฉพาะค่า placeholder
#
# ⚠ allowlist นี้มีไว้ยกเว้น "ค่าที่รู้แน่ว่าไม่ใช่ความลับจริง" เท่านั้น
#   ถ้าความลับจริงหลุดขึ้น git วิธีแก้คือ **เพิกถอนความลับนั้นทิ้ง** ไม่ใช่เพิ่มลงมาที่นี่
#   (ความลับที่เคย commit แล้วลบทีหลัง ยังอยู่ใน history และต้องถือว่ารั่วแล้ว)
#
# regexTarget = "match" เทียบกับข้อความทั้งบรรทัดที่ตรวจเจอ ไม่ใช่เฉพาะส่วนที่ถูกตัดเป็น secret
# — จำเป็น เพราะ rule generic-api-key ตัด secret ออกมาไม่ตรงกับค่าที่เราเขียนไว้เป๊ะ ๆ

[extend]
useDefault = true

[allowlist]
description = "ค่า placeholder ที่ตั้งใจให้อยู่ใน repo (.env.example, docker-compose, ค่าในเทสต์)"
regexTarget = "match"
regexes = [
  '''dev-only-change-me[a-z-]*''',
  '''ci-only-not-a-real-secret[a-z-]*''',
  '''correct-horse-battery-staple-2026''',
  '''nosion-demo-2026''',
  '''postgresql://nosion:nosion@''',
  '''minioadmin''',
  '''0{64}''',
]
paths = [
  '''\.env\.example$''',
  '''docs/learn/.*\.md$''',
]
