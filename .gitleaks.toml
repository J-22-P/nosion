# กฎของ gitleaks สำหรับ NOSION
# ใช้กฎมาตรฐานทั้งหมด แล้วยกเว้นเฉพาะค่าที่เป็น placeholder ซึ่งตั้งใจให้อยู่ใน repo
#
# หมายเหตุสำคัญ: allowlist นี้ยกเว้น "ค่าที่รู้ว่าไม่ใช่ความลับจริง" เท่านั้น
# ห้ามเพิ่มค่าจริงลงมาเพื่อให้ CI เขียว — ถ้าความลับจริงหลุดขึ้น git
# วิธีแก้คือเพิกถอนความลับนั้นทิ้ง ไม่ใช่ปิดเครื่องตรวจ

[extend]
useDefault = true

[[allowlists]]
description = "ค่าตัวอย่างใน .env.example และ CI — เป็น placeholder ที่ตั้งใจให้เห็น"
regexes = [
  '''dev-only-change-me[a-z-]*''',
  '''ci-only-not-a-real-secret[a-z-]*''',
  '''0{64}''',
  '''minioadmin''',
  '''postgresql://nosion:nosion@''',
  '''nosion-demo-2026''',
  '''correct-horse-battery-staple-2026''',
]

[[allowlists]]
description = "ไฟล์ที่เป็นตัวอย่าง/เอกสาร ไม่เก็บความลับจริง"
paths = [
  '''\.env\.example$''',
  '''docker-compose\.ya?ml$''',
  '''docs/learn/.*\.md$''',
]
