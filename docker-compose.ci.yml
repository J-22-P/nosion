# ใช้ใน CI สำหรับ E2E — build image จริงแล้วรันเหมือน production
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nosion
      POSTGRES_PASSWORD: nosion
      POSTGRES_DB: nosion_test
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nosion']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nosion:nosion@postgres:5432/nosion_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGINS: http://localhost:3000
    ports: ['3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ['3000:3000']
    depends_on: [api]
