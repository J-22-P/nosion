name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # push ใหม่บน PR เดิม → ยกเลิก run เก่า ประหยัดเวลา

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://nosion:nosion@localhost:5432/nosion_test
  # ค่าปลอมสำหรับ CI เท่านั้น — production ใช้ secret ของ environment
  JWT_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret

jobs:
  # ── งานเบา รันขนานกันทั้งหมด ────────────────────────────
  lint:
    name: Lint · Format · Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nosion
          POSTGRES_PASSWORD: nosion
          POSTGRES_DB: nosion_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 20
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:deploy
      - run: pnpm test:int
        env:
          REDIS_URL: redis://localhost:6379

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # secret ที่หลุดเข้า git history — สแกนทุก commit ไม่ใช่แค่ diff ล่าสุด
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
      - uses: ./.github/actions/setup

      # ด่านที่บล็อกจริงสำหรับ dependency ของ npm — เราคุมเวอร์ชันเองได้ผ่าน pnpm.overrides
      - run: pnpm audit --audit-level=high

      # Trivy สแกนไฟล์ในโปรเจกต์ ซึ่งทับซ้อนกับ pnpm audit เป็นส่วนใหญ่
      # แต่รายงานคนละชุดกัน (คนละฐานข้อมูล, ไม่เข้าใจ pnpm overrides)
      # → ให้ "รายงานแต่ไม่บล็อก" ที่ชั้นนี้ แล้วไปบล็อกที่ชั้นที่มีความหมายกว่าคือ
      #   การสแกน image จริงที่จะ deploy (จะเพิ่มใน deploy-staging.yml · Phase 2)
      #
      # เหตุผล: gate ที่แดงด้วยเรื่องที่เราแก้ไม่ได้ จะถูกคนทั้งทีมเรียนรู้ที่จะเมิน
      # ซึ่งอันตรายกว่าการไม่มี gate เลย
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

  # ── UI: visual regression + axe (API ปลอมด้วย page.route — ไม่ต้องมี DB) ──
  ui:
    name: UI · visual + a11y
    needs: [lint, unit]
    runs-on: ubuntu-latest
    # image เดียวกับ scripts/playwright-docker.sh → ฟอนต์/การ render ตรงกับภาพ baseline
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@nosion/web
      # --update-snapshots=missing: ภาพที่ยังไม่มี baseline ถูก "เขียน" ลงโฟลเดอร์ (อัปโหลดเป็น artifact ด้านล่าง)
      # แต่เทสต์นั้น **ยังล้ม** (Playwright 1.63 — ตรวจแล้วใน CI run แรก) → job แดงจนกว่าจะ commit baseline
      # ซึ่งเป็นสัญญาณที่ถูก: ไม่มี baseline = ยังไม่ได้ตรวจ · ภาพที่มีแล้วเทียบตามปกติ ต่างเกิน 1% = ล้ม
      - run: pnpm --filter @nosion/web exec playwright test --project=ui --update-snapshots=missing
        env:
          HOME: /root # ตามคำแนะนำของ Playwright เมื่อรันใน container ด้วย user root
      - name: อัปโหลดภาพ baseline ที่สร้างใหม่
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: apps/web/e2e/__screenshots__
          if-no-files-found: ignore
      - name: อัปโหลดรายงาน Playwright (มี diff ของภาพ + ผล axe)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  build:
    name: Build ${{ matrix.app }}
    needs: [lint, unit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@nosion/${{ matrix.app }}
